{% extends "base.html" %}
{% block content %}

<main class="container container-wide">
    <h2 class="page-title">✨ Liste des talents</h2>

    <div class="filters-bar">
        <input type="text" id="filter-talent-name" placeholder="Rechercher un talent...">
        <input type="text" id="filter-skill-name" placeholder="Filtrer par skill contenu...">
        <span id="talent-result-count" class="result-count"></span>
    </div>

    <div class="table-wrapper">
        <table class="data-table" id="talent-table">
            <thead>
                <tr>
                    <th>Talent</th>
                    <th>Nb skills / traits</th>
                    <th>Prérequis</th>
                    <th>Débloque</th>
                </tr>
            </thead>
            <tbody id="talent-table-body"></tbody>
        </table>
    </div>
</main>

<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <button type="button" class="modal-close" id="modal-close">✕</button>
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    window.TALENTS_DATA = {{ talents_json }};
</script>
<script src="{{ url_for('static', filename='talents.js') }}"></script>
{% endblock %}
