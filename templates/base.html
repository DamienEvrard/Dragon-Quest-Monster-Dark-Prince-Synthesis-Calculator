<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Calculateur de synthèse — DQM: The Dark Prince{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="page-header">
    <h1>🐉 DQM: The Dark Prince <span>— Calculateur de synthèse</span></h1>
    <nav class="tabs">
        <a href="{{ url_for('index') }}" class="tab {% if active_tab == 'arbre' %}active{% endif %}">Arbre de synthèse</a>
        <a href="{{ url_for('compendium') }}" class="tab {% if active_tab == 'compendium' %}active{% endif %}">Compendium</a>
        <a href="{{ url_for('talents_page') }}" class="tab {% if active_tab == 'talents' %}active{% endif %}">Talents</a>
    </nav>
</header>

{% block content %}{% endblock %}

<footer class="page-footer">
    Premier jet — données issues du repo <a href="https://github.com/MetalKid/DQM3_Database" target="_blank">MetalKid/DQM3_Database</a>
</footer>

{% block scripts %}{% endblock %}

</body>
</html>
